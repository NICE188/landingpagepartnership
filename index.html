<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <meta name="description" content="Welcome to our official promotion page.">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Container -->
    <main class="container">

        <!-- Logo -->
        <div class="logo-wrapper">
            <img
                src="https://via.placeholder.com/180x60?text=YOUR+LOGO"
                alt="Logo"
                class="logo"
            >
        </div>

        <!-- Hero Section -->
        <section class="hero">

            <h1>Welcome</h1>

            <p class="subtitle">
                Discover our latest promotion and exclusive offers.
            </p>

            <!-- Promotion Card -->
            <div class="promo-card">

                <h2>Special Promotion</h2>

                <p>
                    Click the button below to continue to our official
                    promotion page.
                </p>

                <!-- Referral Button -->
                <a
                    href="https://YOUR-REFERRAL-LINK.com"
                    class="cta-button"
                    id="referralButton"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    立即进入
                </a>

            </div>

        </section>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <!-- Footer -->
        <footer>
            <p>© 2026 All Rights Reserved.</p>
        </footer>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
